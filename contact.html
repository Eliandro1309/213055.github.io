<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Meu Blog Pessoal</title>
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header>
        <h1>Fale Comigo</h1>
        <nav>
            <ul>
                <li> <a href="index.html">Home</a> </li>
                <li> <a href="about.html">Sobre Mim</a> </li>
                <li> <a href="curriculum.html">Currículo</a> </li>
                <li> <a href="receitas.html">Receitas</a> </li>
                <li> <a href="contact.html">Contato</a> </li>
            </ul>
        </nav>
        <div id="controles-acessibilidade">
            <button id="btn-dark-mode">
                <span class="material-symbols-outlined">dark_mode</span>
            </button>
            <button id="btn-aumentar">
                <span class="material-symbols-outlined">zoom_in</span>
            </button>
            <button id="btn-diminuir">
                <span class="material-symbols-outlined">zoom_out</span>
            </button>
        </div>
    </header>

    <main id="conteudo-pagina">
        <section id="contato">
            <h2>Envie uma mensagem</h2>
            <p>Preencha os campos abaixo para entrar em contato diretamente comigo.</p>
            
            <form id="form-contato" action="#" method="post" onsubmit="return validateForm()">
                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
                </div>

                <div class="campo">
                    <label for="assunto">Assunto:</label>
                    <select id="assunto" name="assunto">
                        <option value="sugestao">Sugestão</option>
                        <option value="critica">Crítica</option>
                        <option value="elogio">Elogio</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>

                <button type="submit" id="btn-enviar">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Desenvolvido por Eliandro Silva para fins acadêmicos.</p>
    </footer>

    <script src="./js/script.js"></script>

</body>
</html>
